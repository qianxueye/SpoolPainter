name: POS Android verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pos-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  patch_workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify non-destructive patch export and replay
        run: python3 scripts/test_pos_patchset.py
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Install verified Android tools and platform
        shell: bash
        run: |
          sdk_root="$RUNNER_TEMP/android-sdk"
          archive="$RUNNER_TEMP/android-commandline-tools.zip"
          curl --fail --location --retry 3 --output "$archive" https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip
          printf '%s  %s\n' 'e025545c62a8e64c7559119566a569fb1dec5f60' "$archive" | sha1sum --check
          mkdir -p "$sdk_root/cmdline-tools" "$RUNNER_TEMP/android-tools-unpack"
          unzip -q "$archive" -d "$RUNNER_TEMP/android-tools-unpack"
          mv "$RUNNER_TEMP/android-tools-unpack/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          export ANDROID_HOME="$sdk_root"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk_root" "$sdk_root" >> "$GITHUB_ENV"
          printf '%s\n' "$sdk_root/cmdline-tools/latest/bin" "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" --licenses > /dev/null
          set -o pipefail
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test, lint and assemble
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
